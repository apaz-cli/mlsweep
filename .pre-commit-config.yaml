repos:
  - repo: local
    hooks:
      - id: forbid-uv-lock
        name: "forbid uv.lock"
        entry: sh -c '! git diff --cached --name-only | grep -Fx uv.lock'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - aiohttp
          - aiosqlite>=0.17
          - optuna>=3.0
          - tomli>=2.0
        files: ^mlsweep/
