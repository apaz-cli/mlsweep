<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico">
<title>mlsweep — Code</title>
<link rel="stylesheet" href="common.css">
<style>
:root {
  --tok-kw: #8a3fbf; --tok-str: #2a7a2a; --tok-num: var(--warn); --tok-com: #8b8b8b; --tok-def: var(--accent-text);
  --hl: color-mix(in srgb, var(--accent-text) 13%, transparent);
  --add-bg: color-mix(in srgb, var(--ok) 12%, transparent); --add-fg: #1f7a1f;
  --del-bg: color-mix(in srgb, var(--bad) 11%, transparent); --del-fg: var(--bad);
  --code-bg: var(--surface-3, var(--surface));
}
[data-theme=dark] {
  --tok-kw: #c792ea; --tok-str: #a5d6a7; --tok-num: #f7b267; --tok-com: #6b6b6b;
  --hl: color-mix(in srgb, var(--accent-text) 16%, transparent);
  --add-bg: color-mix(in srgb, var(--ok) 10%, transparent); --add-fg: #8ee58e;
  --del-bg: color-mix(in srgb, var(--bad) 10%, transparent); --del-fg: #ff9a9a;
}
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#layout { flex: 1; display: flex; min-height: 0; }

/* ── Sidebar, as on Logs and Artifacts ─────────────────────────────────────── */
#sidebar { width: 270px; min-width: 270px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
#sidebar-top { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
.sb-section { display: flex; flex-direction: column; gap: 6px; }
.sb-title { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: baseline; gap: 6px; }
.sb-title .sb-note { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-muted); }
.sb-row { display: flex; gap: 6px; align-items: center; }
select { min-width: 0; padding: 5px 7px; border: 1px solid var(--border-input); border-radius: 4px; font-size: 12px; background: var(--btn-bg); color: var(--text); }
#sidebar select { flex: 1; }
select:focus, input:focus { outline: none; border-color: var(--accent); }
#job-list { flex: 1; overflow-y: auto; }
.job-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); border-left: 2px solid transparent; }
.job-item:hover { background: var(--btn-hover); }
.job-item.selected { background: var(--radio-checked-bg); border-left-color: var(--radio-checked-border); }
.job-item.same { border-left-color: color-mix(in srgb, var(--radio-checked-border) 40%, transparent); }
.job-item-top { display: flex; align-items: center; gap: 6px; }
.job-run-id { font-family: monospace; font-size: 11px; color: var(--text-strong); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-combo { font-size: 10px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-list-msg { padding: 20px 12px; color: var(--text-muted); font-size: 12px; text-align: center; line-height: 1.6; }
.ver-tag { font-family: monospace; font-size: 9.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border-input); color: var(--text-label); flex-shrink: 0; }

/* ── Header ────────────────────────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#code-header { background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.hdr-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; min-width: 0; }
.hdr-title { font-size: 14px; font-weight: 600; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hdr-title .mono { font-family: monospace; font-size: 13px; }
.hdr-kind { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
.hdr-spacer { flex: 1; }
.hdr-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.hdr-controls select { font-size: 11.5px; padding: 3px 6px; max-width: 230px; }
.btn { font-size: 11.5px; padding: 3px 10px; border: 1px solid var(--border-input); border-radius: 4px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; line-height: 1.5; }
.btn:hover { background: var(--btn-hover); color: var(--text-strong); }
.btn.on { background: var(--radio-checked-bg); border-color: var(--radio-checked-border); color: var(--radio-checked-color); }
.btn svg { flex-shrink: 0; }
.hdr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; padding: 2px 16px 10px; font-size: 11.5px; color: var(--text-muted); }
.hdr-meta > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.hdr-meta > span + span::before { content: "·"; margin: 0 9px; color: var(--border-strong, var(--text-muted)); }
.hdr-meta .k { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.hdr-meta .v { color: var(--text-label); font-family: monospace; font-size: 11px; }
.hdr-meta a { color: var(--accent-text); text-decoration: none; cursor: pointer; font-family: monospace; font-size: 11px; }
.hdr-meta a:hover { text-decoration: underline; }
.hdr-meta .warn, .hdr-meta a.warn { color: var(--warn); }

/* Compare banner */
#compare-bar { display: none; align-items: center; gap: 10px; padding: 6px 16px; font-size: 11.5px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--accent-text) 7%, var(--surface)); color: var(--text-label); }
#compare-bar.on { display: flex; }
#compare-bar .n { font-variant-numeric: tabular-nums; }
#compare-bar .add { color: var(--ok); } #compare-bar .mod { color: var(--warn); } #compare-bar .del { color: var(--bad); }
#compare-bar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }

/* Provenance panel */
#details { display: none; border-top: 1px solid var(--border); padding: 12px 16px 14px; background: var(--surface); max-height: 45vh; overflow: auto; }
#details.on { display: block; }
.prov-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 12px; }
.prov-grid .k { color: var(--text-muted); font-size: 11px; padding-top: 1px; }
.prov-grid .v { color: var(--text); font-family: monospace; font-size: 11.5px; overflow-wrap: anywhere; min-width: 0; }
.prov-grid .v a { color: var(--accent-text); text-decoration: none; cursor: pointer; }
.prov-grid .v a:hover { text-decoration: underline; }
.prov-grid .v .muted { color: var(--text-muted); font-family: system-ui, sans-serif; }
.prov-list { margin: 0; padding: 0; list-style: none; }
.prov-list li { padding: 1px 0; }
.prov-section { margin-top: 12px; }
.prov-section h4 { margin: 0 0 6px; font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.prov-cmd { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font-family: monospace; font-size: 11.5px; overflow-x: auto; white-space: pre; color: var(--text); }

/* ── Tree and file ─────────────────────────────────────────────────────────── */
#code-inner { flex: 1; display: flex; min-height: 0; }
#tree-pane { width: 260px; min-width: 200px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
#tree-filter { margin: 8px 10px 4px; padding: 4px 8px; border: 1px solid var(--border-input); border-radius: 4px; font-size: 12px; background: var(--btn-bg); color: var(--text); }
#file-tree { flex: 1; overflow-y: auto; padding: 4px 0 10px; }
.file-row { display: flex; align-items: center; gap: 5px; padding: 3px 12px 3px 0; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; color: var(--text); }
.file-row:hover { background: var(--btn-hover); }
.file-row.selected { background: var(--radio-checked-bg); color: var(--radio-checked-color); }
.file-row .caret { width: 12px; font-size: 9px; color: var(--text-muted); flex-shrink: 0; text-align: center; }
.file-row .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.file-row.dir .fname { color: var(--text-label); }
.file-row .fsize { font-size: 10px; color: var(--text-muted); padding-left: 6px; flex-shrink: 0; }
.file-row .mark { font-family: monospace; font-size: 10px; font-weight: 700; width: 12px; text-align: center; flex-shrink: 0; }
.file-row.ch-A .mark { color: var(--ok); } .file-row.ch-M .mark { color: var(--warn); } .file-row.ch-D .mark { color: var(--bad); }
.file-row.ch-D .fname { text-decoration: line-through; color: var(--text-muted); }
.file-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
.kids.closed { display: none; }
.tree-msg { padding: 14px 12px; font-size: 11.5px; color: var(--text-muted); }

#viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#path-bar { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 12px; min-height: 32px; background: var(--surface); }
#crumbs { font-family: monospace; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#crumbs a { color: var(--text-muted); text-decoration: none; cursor: pointer; }
#crumbs a:hover { color: var(--accent-text); text-decoration: underline; }
#crumbs .sep { margin: 0 5px; opacity: .6; }
#crumbs b { color: var(--text-strong); font-weight: 600; }
#sel { color: var(--accent-text); font-size: 11px; white-space: nowrap; }
#sel.tip { color: var(--text-muted); opacity: .8; }
#file-meta { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
#view { flex: 1; overflow: auto; position: relative; }
.msg { padding: 48px 30px; color: var(--text-muted); font-size: 13px; text-align: center; line-height: 1.6; }
.msg.err { color: var(--bad); }

table.src { border-collapse: collapse; font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.6; width: 100%; }
table.src td { padding: 0; vertical-align: top; }
table.src td.n { color: var(--text-muted); text-align: right; padding: 0 12px 0 18px; user-select: none; cursor: pointer; width: 1%; white-space: nowrap; font-size: 11.5px; }
table.src td.n:hover { color: var(--text-strong); }
table.src td.c { padding: 0 18px 0 14px; white-space: pre; color: var(--text); border-left: 1px solid var(--border); }
table.src tr:first-child td { padding-top: 10px; }
table.src tr:last-child td { padding-bottom: 16px; }
table.src tr.hl td { background: var(--hl); }
table.src tr.hl td.n { color: var(--accent-text); box-shadow: inset 3px 0 0 var(--accent-text); }

/* Diffs: old and new line numbers, then the line. */
table.src.diff td.n { cursor: default; }
table.src.diff tr.add td { background: var(--add-bg); }
table.src.diff tr.del td { background: var(--del-bg); }
table.src.diff tr.add td.c { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--ok) 70%, transparent); }
table.src.diff tr.del td.c { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bad) 70%, transparent); }
table.src.diff tr.add td.sign { color: var(--add-fg); } table.src.diff tr.del td.sign { color: var(--del-fg); }
table.src.diff td.sign { width: 1%; padding: 0 2px 0 8px; user-select: none; color: var(--text-muted); }
table.src.diff tr.hunk td { background: var(--code-bg); color: var(--text-muted); font-family: system-ui, sans-serif; font-size: 11px; padding: 4px 14px; }
table.src.diff tr.file td { background: var(--surface); color: var(--text-strong); font-weight: 600; padding: 10px 16px 6px; font-size: 12px; border-top: 1px solid var(--border); }
table.src.diff tr.file:first-child td { border-top: 0; }

/* Directory listing */
table.dirlist { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.dirlist td { padding: 6px 16px; border-bottom: 1px solid var(--border); }
table.dirlist tr { cursor: pointer; }
table.dirlist tr:hover td { background: var(--btn-hover); }
table.dirlist td.name { font-family: monospace; color: var(--text); }
table.dirlist tr.d td.name { color: var(--accent-text); }
table.dirlist td.size { text-align: right; color: var(--text-muted); font-size: 11px; width: 1%; white-space: nowrap; }

.cm-keyword, .cm-meta { color: var(--tok-kw); } .cm-string, .cm-string-2 { color: var(--tok-str); }
.cm-number, .cm-atom { color: var(--tok-num); } .cm-comment { color: var(--tok-com); font-style: italic; }
.cm-def, .cm-builtin, .cm-property, .cm-attribute { color: var(--tok-def); } .cm-tag { color: var(--tok-kw); }
.cm-operator { color: var(--text-label); }
#no-sel { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px; line-height: 1.6; }

/* The Copy menu */
.menu-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 260px; background: var(--surface); border: 1px solid var(--border-input); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 4px; display: none; }
.pop.on { display: block; }
.pop button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; color: var(--text); font-size: 12px; }
.pop button:hover { background: var(--btn-hover); }
.pop button small { display: block; color: var(--text-muted); font-size: 10.5px; margin-top: 1px; }
</style>
<script src="chrome.js"></script>
<script src="dialog.js"></script>
<script src="campaign.js"></script>
</head>
<body>

<nav data-page="code"></nav>
<script src="nav.js"></script>

<div id="layout">
  <div id="sidebar">
    <div id="sidebar-top">
      <div class="sb-section">
        <span class="sb-title">Campaign</span>
        <div class="sb-row"><select id="campaign-select"></select></div>
      </div>
      <div class="sb-section">
        <span class="sb-title">Experiment</span>
        <div class="sb-row">
          <select id="exp-select"><option disabled selected>Loading…</option></select>
          <button class="icon-btn" id="refresh-btn" title="Refresh experiments, runs and code">&#8635;</button>
        </div>
      </div>
      <div class="sb-section">
        <span class="sb-title">Runs <span class="sb-note" id="runs-note"></span></span>
      </div>
    </div>
    <div id="job-list"><div class="job-list-msg">Loading…</div></div>
  </div>

  <div id="main">
    <div id="code-header" style="display:none">
      <div class="hdr-top">
        <span class="hdr-kind" id="hdr-kind"></span>
        <span class="hdr-title" id="hdr-title"></span>
        <span id="hdr-badge"></span>
        <span class="hdr-spacer"></span>
        <div class="hdr-controls">
          <select id="version-select" title="Which version of the experiment's code"></select>
          <button type="button" class="btn" id="compare-btn" title="See what changed against another version, run or experiment">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><path d="M4 5.3v3.2a3 3 0 0 0 3 3h3.2M12 10.7V7.5a3 3 0 0 0-3-3H5.8"/></svg>Compare…</button>
          <button type="button" class="btn" id="details-btn" title="Where this code came from">Details</button>
          <div class="menu-wrap">
            <button type="button" class="btn" id="copy-btn" title="Copy a reference to this code for a note">Copy ▾</button>
            <div class="pop" id="copy-pop">
              <button type="button" data-copy="link">Note link<small>Follows the experiment's latest code</small></button>
              <button type="button" data-copy="pinned">Note link to this version<small>Always shows exactly this code</small></button>
              <button type="button" data-copy="block">Code block for a note<small>Shows the selected lines in the note</small></button>
              <button type="button" data-copy="path">File path</button>
            </div>
          </div>
          <a class="icon-btn" id="zip-link" title="Download all of this code as a zip">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6.5" y1="1" x2="6.5" y2="9"/><polyline points="3,6 6.5,9.5 10,6"/><line x1="1.5" y1="12" x2="11.5" y2="12"/></svg>
          </a>
        </div>
      </div>
      <div class="hdr-meta" id="hdr-meta"></div>
      <div id="compare-bar">
        <span id="compare-text"></span>
        <span class="hdr-spacer"></span>
        <label><input type="checkbox" id="changed-only" checked> Changed files only</label>
        <button type="button" class="btn" id="compare-change">Change…</button>
        <button type="button" class="btn" id="compare-stop">Stop comparing</button>
      </div>
      <div id="details"></div>
    </div>
    <div id="code-inner" style="display:none">
      <div id="tree-pane">
        <input id="tree-filter" placeholder="Filter files" autocomplete="off" spellcheck="false">
        <div id="file-tree"></div>
      </div>
      <div id="viewer">
        <div id="path-bar">
          <span id="crumbs"></span>
          <span id="sel"></span>
          <span class="hdr-spacer"></span>
          <span id="file-meta"></span>
          <a class="icon-btn" id="raw-link" target="_blank" rel="noopener" title="Download this file" style="width:24px;height:24px">
            <svg width="12" height="12" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6.5" y1="1" x2="6.5" y2="9"/><polyline points="3,6 6.5,9.5 10,6"/><line x1="1.5" y1="12" x2="11.5" y2="12"/></svg>
          </a>
        </div>
        <div id="view"></div>
      </div>
    </div>
    <div id="no-sel">Choose an experiment to see the code its runs used.</div>
  </div>
</div>

<script src="vendor-notes.js"></script>
<script src="cm-simple.js"></script>
<script src="cm-rust.js"></script>
<script src="cm-go.js"></script>
<script src="page-code.js"></script>
</body>
</html>
