<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico">
<title>mlsweep — Experiments</title>
<link rel="stylesheet" href="common.css">
<style>

body { display: flex; flex-direction: column; height: 100vh; }

/* Content */
#content { flex: 1; overflow-y: auto; padding: 18px 24px; }
#table-scroll { overflow-x: auto; }

h2 { font-size: 14px; font-weight: 700; color: var(--text-strong); }
#exp-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 14px; }
#campaign-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-label); }
#campaign-select { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border-input); border-radius: 4px; background: var(--btn-bg); color: var(--text); }
#exp-search { font-size: 12px; padding: 3px 8px; flex: 0 1 220px; min-width: 140px; border: 1px solid var(--border-input); border-radius: 4px; background: var(--btn-bg); color: var(--text); }
#exp-search:focus { outline: none; border-color: var(--accent); }
#exp-filters { display: flex; gap: 4px; }
.filter-chip { white-space: nowrap; font-size: 11px; padding: 2px 9px; border: 1px solid var(--border-input); border-radius: 3px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; font-family: inherit; }
.filter-chip:hover { background: var(--btn-hover); }
.filter-chip.active { background: var(--radio-checked-bg); border-color: var(--radio-checked-border); color: var(--radio-checked-color); text-shadow: .35px 0 0 currentColor, -.35px 0 0 currentColor; }
.filter-chip .n { color: var(--text-muted); font-variant-numeric: tabular-nums; margin-left: 2px; }
.filter-chip.active .n { color: inherit; }
#exp-shown { font-size: 11px; color: var(--text-muted); }
.refs-cell { white-space: nowrap; }
/* The notes and traces badges, one above the other. */
.refs { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.note-ref { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; font-size: 10px; font-weight: 600; font-family: system-ui, sans-serif; color: var(--accent-text); background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 3px; text-decoration: none; vertical-align: middle; font-variant-numeric: tabular-nums; }
.note-ref svg { width: 10px; height: 10px; }
a.note-ref:hover { background: var(--radio-checked-bg); border-color: var(--accent); }
.note-ref.zero { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); border-color: color-mix(in srgb, var(--bad) 40%, transparent); cursor: default; }
.campaign-tag { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-left: 8px; }

/* Status badges */

/* Experiments table */
.exp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.exp-table th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.exp-row td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
/* Half a monitor: tighter cells, so the table fits beside the other window. */
@media (max-width: 920px) {
  #content { padding: 14px; }
  .exp-table th { letter-spacing: 0; font-size: 9.5px; }
  .exp-table th, .exp-row td { padding-left: 5px; padding-right: 5px; }
}
.exp-row:hover td { background: var(--btn-hover); }
.exp-row.expanded td { background: var(--btn-hover); }
.exp-toggle { cursor: pointer; font-size: 11px; color: var(--text-dim); user-select: none; margin-right: 6px; }
.exp-name-cell { display: flex; align-items: center; }
.exp-name { font-weight: 600; color: var(--text-strong); }
/* The description on hover: a fixed panel, large enough to read, that never
   widens a row or gets clipped by the table's scroll box. */
.exp-note-tip { position: fixed; z-index: 1200; pointer-events: none; max-width: min(34rem, calc(100vw - 16px)); padding: 10px 13px; border: 1px solid var(--border-input); border-radius: 6px; background: var(--surface); color: var(--text); box-shadow: 0 8px 28px rgba(0,0,0,.28); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.45; white-space: normal; overflow-wrap: anywhere; }
.exp-note-tip[hidden] { display: none; }
.exp-manager-note.paused { color: var(--warn); }
.exp-no-desc { font: inherit; font-size: 10px; color: var(--text-muted); background: none; border: 1px dashed var(--border-input); border-radius: 3px; padding: 0 5px; margin-left: 8px; cursor: pointer; vertical-align: middle; }
.exp-no-desc:hover { color: var(--text); border-color: var(--accent); }
.exp-manager-note { font-size: 11px; color: var(--text-muted); margin-left: 8px; max-width: 48ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
/* Action cells stay table cells (the buttons flex inside a div), so they
   stretch to the row and its bottom border stays one line. */
.btn-delete { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 27%, transparent); }
.runs-tools td { padding: 6px 10px 6px 28px !important; background: var(--bg) !important; border-bottom: 1px solid var(--border); }
.btn-delete:hover { background: color-mix(in srgb, var(--bad) 9%, transparent); }

/* Runs: rows of the experiments table, right after their experiment's row,
   so they share its columns.  Worker, Elapsed and Combo span the count columns. */
.runs-head td { padding: 6px 10px 4px; color: var(--text-dim); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: var(--bg); }
.run-row td, .runs-empty td { padding: 5px 10px; font-size: 11px; border-bottom: 1px solid var(--border); vertical-align: middle; background: var(--bg); }
.runs-head td:first-child, .run-row td:first-child, .runs-empty td { padding-left: 30px; }
/* Long run IDs wrap when space runs out rather than widening the Name column. */
.run-row td:first-child { overflow-wrap: anywhere; }
.run-row:hover td { background: var(--btn-hover); }
.runs-empty td { color: var(--text-muted); }
.mono { font-family: monospace; font-size: 10px; }
.combo-cell { color: var(--text-dim); }
/* Zero width so a long combo ends in an ellipsis instead of widening the columns it spans. */
.combo-clip { width: 0; min-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Half a monitor: the run rows tighten like the experiment rows. */
@media (max-width: 920px) {
  .runs-head td, .run-row td, .runs-empty td { padding-left: 5px; padding-right: 5px; }
  .runs-head td:first-child, .run-row td:first-child, .runs-empty td { padding-left: 16px; }
}

/* Job detail expand */
.job-toggle { cursor: pointer; font-size: 10px; color: var(--text-dim); user-select: none; margin-right: 5px; }
.job-detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
.job-detail-panel { padding: 8px 12px 10px 28px; background: var(--surface); display: flex; flex-direction: column; gap: 7px; }
.job-detail-section { display: flex; flex-wrap: wrap; gap: 14px; }
.job-detail-item { display: flex; flex-direction: column; gap: 1px; }
.job-detail-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
.job-detail-value { font-size: 11px; color: var(--text); font-family: monospace; }
.job-detail-value.muted { color: var(--text-muted); }
.job-cmd-block { font-family: monospace; font-size: 10px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 5px 8px; white-space: pre-wrap; word-break: break-all; max-height: 80px; overflow-y: auto; }

.count-cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
#empty-msg { color: var(--text-muted); font-size: 13px; margin-top: 40px; text-align: center; }
#empty-msg .run-cmd { display: inline-block; margin-top: 10px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-family: monospace; font-size: 12px; color: var(--text); text-align: left; white-space: pre; }
#empty-msg .run-label { font-size: 11px; color: var(--text-dim); margin-top: 14px; }
#error-msg { color: var(--bad); font-size: 12px; margin-bottom: 10px; }

/* Connection indicator */
</style>
<script src="chrome.js"></script>
<script src="dialog.js"></script>
<script src="campaign.js"></script>
</head>
<body>
<nav data-page="experiments"></nav>
<script src="nav.js"></script>
<div id="content">
  <div id="exp-header">
    <h2>Experiments</h2>
    <label id="campaign-bar">Campaign <select id="campaign-select"></select></label>
    <input id="exp-search" type="search" placeholder="Search experiments…" autocomplete="off" spellcheck="false" title="Match words in the name, ID or note">
    <div id="exp-filters">
      <button class="filter-chip active" data-filter="all">All <span class="n"></span></button>
      <button class="filter-chip" data-filter="running">Running <span class="n"></span></button>
      <button class="filter-chip" data-filter="completed">Completed <span class="n"></span></button>
      <button class="filter-chip" data-filter="failed">Failed <span class="n"></span></button>
    </div>
    <span id="exp-shown"></span>
  </div>
  <div id="error-msg" style="display:none"></div>
  <div id="empty-msg" style="display:none"></div>
  <div id="table-scroll">
  <table class="exp-table" id="exp-table">
    <thead>
      <tr>
        <th style="width:35%">Name</th>
        <th style="width:8%">Status</th>
        <th style="width:6%;text-align:right">Done</th>
        <th style="width:6%;text-align:right">Failed</th>
        <th style="width:6%;text-align:right">XFailed</th>
        <th style="width:6%;text-align:right">Running</th>
        <th style="width:6%;text-align:right">Finished</th>
        <th style="width:11%">Submitted</th>
        <th style="width:5%" title="Notes that mention it, and the agent traces that submitted it">Refs</th>
        <th style="width:11%">Actions</th>
      </tr>
    </thead>
    <tbody id="exp-tbody"></tbody>
  </table>
  </div>
</div>

<script src="rowmenu.js"></script>
<script src="page-experiments.js"></script>
</body>
</html>
