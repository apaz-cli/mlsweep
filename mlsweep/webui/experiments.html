<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico">
<title>mlsweep — Experiments</title>
<link rel="stylesheet" href="common.css">
<style>

body { display: flex; flex-direction: column; height: 100vh; }

/* Content */
#content { flex: 1; overflow-y: auto; padding: 18px 24px; }

h2 { font-size: 14px; font-weight: 700; color: var(--text-strong); }
#exp-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
#campaign-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-label); }
#campaign-select { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border-input); border-radius: 4px; background: var(--btn-bg); color: var(--text); }
.campaign-tag { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-left: 8px; }

/* Status badges */

/* Experiments table */
.exp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.exp-table th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.exp-row td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.exp-row:hover td { background: var(--btn-hover); }
.exp-row.expanded td { background: var(--btn-hover); }
.exp-toggle { cursor: pointer; font-size: 11px; color: var(--text-dim); user-select: none; margin-right: 6px; }
.exp-name-cell { display: flex; align-items: center; }
.exp-name { font-weight: 600; color: var(--text-strong); }
.exp-note { font-size: 11px; color: var(--text-muted); font-style: italic; margin-left: 8px; }
/* Action cells stay table cells (the buttons flex inside a div), so they
   stretch to the row and its bottom border stays one line. */
.actions-cell { white-space: nowrap; }
.actions { display: flex; gap: 6px; align-items: center; }
.btn-link { font-size: 11px; padding: 2px 8px; border: 1px solid var(--border-input); border-radius: 3px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn-link:hover { background: var(--btn-hover); }
.btn-delete { color: #c0392b; border-color: #c0392b44; }
.runs-tools td { padding: 6px 10px 6px 28px !important; background: var(--bg) !important; border-bottom: 1px solid var(--border); }
.btn-delete:hover { background: #c0392b18; }

/* Two controls per row: View ▾ for the pages, Manage for the verbs.  The menu is
   fixed-positioned, so it can overhang the table however narrow the window is. */
.btn-menu, .btn-manage { padding: 2px 7px; }
.row-menu { position: fixed; z-index: 50; min-width: 170px; padding: 4px; background: var(--surface); border: 1px solid var(--border-input); border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.28); display: flex; flex-direction: column; }
.row-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 12px; padding: 5px 9px; border: 0; border-radius: 3px; background: none; color: var(--text); cursor: pointer; text-decoration: none; white-space: nowrap; }
.row-menu-item:hover { background: var(--btn-hover); }
.row-menu-item.danger { color: #d62728; }
.row-menu-item.disabled { color: var(--text-muted); cursor: default; }
.row-menu-item.disabled:hover { background: none; }
.mi-icon { display: flex; flex-shrink: 0; color: var(--text-dim); }
.mi-icon svg { width: 12px; height: 12px; display: block; }
.row-menu-item:hover .mi-icon { color: inherit; }
.mi-label { flex: 1; }
.mi-count { color: var(--text-dim); font-variant-numeric: tabular-nums; }
.row-menu-item:hover .mi-count { color: var(--text-label); }
.row-menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }

/* Runs: rows of the experiments table, right after their experiment's row,
   so they share its columns.  Worker, Elapsed and Combo span the count columns. */
.runs-head td { padding: 6px 10px 4px; color: var(--text-dim); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: var(--bg); }
.run-row td, .runs-empty td { padding: 5px 10px; font-size: 11px; border-bottom: 1px solid var(--border); vertical-align: middle; background: var(--bg); }
.runs-head td:first-child, .run-row td:first-child, .runs-empty td { padding-left: 30px; }
/* Long run IDs wrap when space runs out rather than widening the Name column. */
.run-row td:first-child { overflow-wrap: anywhere; }
.run-row:hover td { background: var(--btn-hover); }
.runs-empty td { color: var(--text-muted); }
.mono { font-family: monospace; font-size: 10px; }
.combo-cell { color: var(--text-dim); }
/* Zero width so a long combo ends in an ellipsis instead of widening the columns it spans. */
.combo-clip { width: 0; min-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Job detail expand */
.job-toggle { cursor: pointer; font-size: 10px; color: var(--text-dim); user-select: none; margin-right: 5px; }
.job-detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
.job-detail-panel { padding: 8px 12px 10px 28px; background: var(--surface); display: flex; flex-direction: column; gap: 7px; }
.job-detail-section { display: flex; flex-wrap: wrap; gap: 14px; }
.job-detail-item { display: flex; flex-direction: column; gap: 1px; }
.job-detail-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
.job-detail-value { font-size: 11px; color: var(--text); font-family: monospace; }
.job-detail-value.muted { color: var(--text-muted); }
.job-cmd-block { font-family: monospace; font-size: 10px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 5px 8px; white-space: pre-wrap; word-break: break-all; max-height: 80px; overflow-y: auto; }

.count-cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
#empty-msg { color: var(--text-muted); font-size: 13px; margin-top: 40px; text-align: center; }
#empty-msg .run-cmd { display: inline-block; margin-top: 10px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-family: monospace; font-size: 12px; color: var(--text); text-align: left; white-space: pre; }
#empty-msg .run-label { font-size: 11px; color: var(--text-dim); margin-top: 14px; }
#error-msg { color: #d62728; font-size: 12px; margin-bottom: 10px; }

/* Connection indicator */
</style>
<script src="chrome.js"></script>
<script src="dialog.js"></script>
<script src="campaign.js"></script>
</head>
<body>
<nav data-page="experiments"></nav>
<script src="nav.js"></script>
<div id="content">
  <div id="exp-header">
    <h2>Experiments</h2>
    <label id="campaign-bar">Campaign <select id="campaign-select"></select></label>
  </div>
  <div id="error-msg" style="display:none"></div>
  <div id="empty-msg" style="display:none"></div>
  <table class="exp-table" id="exp-table">
    <thead>
      <tr>
        <th style="width:38%">Name</th>
        <th style="width:8%">Status</th>
        <th style="width:6%;text-align:right">Done</th>
        <th style="width:6%;text-align:right">Failed</th>
        <th style="width:6%;text-align:right">XFailed</th>
        <th style="width:6%;text-align:right">Running</th>
        <th style="width:6%;text-align:right">Finished</th>
        <th style="width:12%">Submitted</th>
        <th style="width:12%">Actions</th>
      </tr>
    </thead>
    <tbody id="exp-tbody"></tbody>
  </table>
</div>

<script src="page-experiments.js"></script>
</body>
</html>
