<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>mlsweep — Results</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="common.css">
<style>

body { display: flex;
       flex-direction: column; height: 100vh;   }

/* Nav bar */

/* Viz layout — sidebar + main — inside the remaining height */
#viz-layout { flex: 1; display: flex; min-height: 0; }

#sidebar { flex: 0 0 clamp(200px, 28vw, 270px); min-width: 0; background: var(--surface);
           border-right: 1px solid var(--border); overflow-y: auto;
           padding: 14px 12px; display: flex; flex-direction: column; gap: 16px; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 12px; gap: 8px; }

.chart-pane { flex: 1; min-height: 0; border: 1px solid var(--border);
              border-radius: 6px; background: var(--plot-bg); }

h1 { font-size: 13px; font-weight: 700; color: var(--text-strong); }
.exp-name { font-size: 10px; color: var(--text-muted); word-break: break-all; margin-top: 2px; }

@keyframes rainbow-sweep {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.exp-name.loading {
  background: linear-gradient(90deg, #f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00,#ff0,#0f0);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
  font-size: 12px;
  animation: rainbow-sweep 1s linear infinite;
}

.section { display: flex; flex-direction: column; gap: 6px; }
.section-title { font-size: 10px; font-weight: 700; color: var(--text-dim);
                 text-transform: uppercase; letter-spacing: 0.06em; }

select { width: 100%; padding: 5px 7px; border: 1px solid var(--border-input);
         border-radius: 4px; font-size: 12px; background: var(--btn-bg); color: var(--text); }
select:focus { outline: none; border-color: var(--accent); }


.radio-row { display: flex; flex-wrap: wrap; gap: 3px; }
.radio-row input[type=radio] { display: none; }
.radio-row label { font-size: 11px; padding: 2px 7px; border: 1px solid var(--border-input);
                   border-radius: 3px; cursor: pointer; background: var(--radio-bg);
                   white-space: nowrap; color: var(--text); }
.radio-row label:hover { background: var(--btn-hover); }
.radio-row label.checked { background: var(--radio-checked-bg); border-color: var(--radio-checked-border);
                           color: var(--radio-checked-color); font-weight: 600; }

.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-header { display: flex; justify-content: space-between; align-items: center; }
.filter-header .axis-label { font-size: 11px; font-weight: 600; color: var(--text-label); }
.filter-btns { display: flex; gap: 3px; }
.filter-btns button { font-size: 9px; padding: 1px 5px; border: 1px solid var(--border-input);
                      background: var(--btn-bg); border-radius: 3px; cursor: pointer; color: var(--btn-text); }
.filter-btns button:hover { background: var(--btn-hover); }

.checkbox-list { display: flex; flex-direction: column; gap: 3px; padding-left: 2px; }
.check-row { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer;
             padding: 1px 0; }
.check-row input[type=checkbox] { cursor: pointer; width: 13px; height: 13px; }
.color-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
                border: 1px solid var(--swatch-border); }
.check-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sub-filter-group { margin-top: 4px; margin-left: 10px; padding-left: 4px;
                    border-left: 2px solid var(--border); }
.sub-filter-group .axis-label { font-size: 10px; color: var(--text-dim); }
.sub-filter-group.hidden { display: none; }

.row { display: flex; gap: 8px; align-items: center; }
.row label { font-size: 12px; white-space: nowrap; }
.row input[type=range] { flex: 1; }
#smooth-val { font-size: 11px; color: var(--text-dim); min-width: 28px; text-align: right; }

/* Tab bar */
#tabbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#tabs { display: flex; gap: 3px; }
.tab { font-size: 11px; padding: 3px 12px; border: 1px solid var(--border-input);
       border-radius: 4px; cursor: pointer; background: var(--btn-bg); color: var(--btn-text);
       font-family: inherit; }
.tab:hover { background: var(--btn-hover); }
.tab.active { background: var(--radio-checked-bg); border-color: var(--radio-checked-border);
              color: var(--radio-checked-color); text-shadow: .35px 0 0 currentColor, -.35px 0 0 currentColor; }

#statusbar { display: flex; align-items: center; gap: 8px; }
#status { font-size: 11px; color: var(--text-muted); }

#sweep-note { font-size: 11px; color: var(--text-muted); font-style: italic;
              margin-top: 4px; word-break: break-word; white-space: pre-line; cursor: pointer; }
#sweep-note:hover { color: var(--text); }
#sweep-note.empty { font-style: normal; opacity: .75; }

/* Highlighted run (curves tab) */
#run-bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); min-height: 36px; }
#run-bar-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.rb-name { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text-strong); white-space: nowrap; }
.rb-pills { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
.rb-pill { font-size: 11px; padding: 1px 7px; border: 1px solid var(--border-input); border-radius: 3px; background: var(--radio-bg); color: var(--text); cursor: pointer; white-space: nowrap; font-family: var(--font-mono); }
.rb-pill:hover { background: var(--radio-checked-bg); border-color: var(--radio-checked-border); color: var(--radio-checked-color); }
.rb-pill .rb-k { color: var(--text-dim); }
.rb-pill:hover .rb-k { color: inherit; }
#run-bar-links { display: flex; gap: 4px; flex-shrink: 0; }
.link-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-text); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
/* "only" on a filter value, shown on hover */
.only-btn { font-size: 9px; padding: 0 5px; border: 1px solid var(--border-input); border-radius: 3px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; visibility: hidden; }
.check-row:hover .only-btn { visibility: visible; }
.only-btn:hover { background: var(--radio-checked-bg); border-color: var(--radio-checked-border); color: var(--radio-checked-color); }

/* Optimization tab */
.opt-scatter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 8px 0 0; }
.opt-scatter-panel { height: 220px; border: 1px solid var(--border); border-radius: 6px; background: var(--plot-bg); }
#chart-optimization { display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; background: transparent; border: none; gap: 8px; padding: 0; }
#opt-minimize-label { font-size: 11px; color: var(--text-label); cursor: pointer; display: none; align-items: center; gap: 4px; }
</style>
<script src="chrome.js"></script>
<script src="dialog.js"></script>
<script src="campaign.js"></script>
<script src="steptimer.js"></script>
</head>
<body>

<!-- Navigation bar (new — not in visualize.py) -->
<nav data-page="results"></nav>
<script src="nav.js"></script>

<!-- Visualization layout (literal copy from visualize.py HTML) -->
<div id="viz-layout">
<div id="sidebar">
  <div>
    <h1>Sweep Visualizer</h1>
    <div class="exp-name loading" id="exp-name">Fetching data…</div>
    <div id="sweep-note" style="display:none"></div>
  </div>

  <div class="section">
    <div class="section-title">Campaign</div>
    <select id="campaign-sel"></select>
  </div>

  <div class="section">
    <div class="section-title">Experiment</div>
    <div class="row">
      <select id="experiment-sel"></select>
      <a class="icon-btn" id="exp-dl-metrics" href="#" style="display:none" title="Download all experiment metrics"><svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6.5" y1="1" x2="6.5" y2="9"/><polyline points="3,6 6.5,9.5 10,6"/><line x1="1.5" y1="12" x2="11.5" y2="12"/></svg></a>
      <button class="icon-btn" id="refresh-experiments" title="Refresh experiment list">&#8635;</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Metric</div>
    <select id="metric-sel"></select>
  </div>

  <!-- Curves-only controls -->
  <div class="section curves-only">
    <div class="section-title">Color by</div>
    <div id="color-by" class="radio-row"></div>
  </div>

  <div class="section curves-only">
    <div class="section-title">Smoothing (EMA)</div>
    <div class="row">
      <input type="range" id="smoothing" min="0" max="0.99" step="0.01" value="0">
      <span id="smooth-val">0.00</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Filters</div>
    <div id="filters"></div>
  </div>
</div>

<div id="main">
  <div id="tabbar">
    <div id="tabs">
      <button class="tab active" data-tab="curves">Curves</button>
      <button class="tab" data-tab="sensitivity">Sensitivity</button>
      <button class="tab" data-tab="optimization">Optimization</button>
    </div>
    <div id="statusbar">
      <div id="status"></div>
      <label id="opt-minimize-label">
        <input type="checkbox" id="opt-minimize" checked> minimize
      </label>
    </div>
  </div>
  <div id="run-bar" style="display:none">
    <div id="run-bar-main"></div>
    <span class="step-timer" id="run-bar-timer" style="display:none"></span>
    <div id="run-bar-links"></div>
  </div>
  <div id="chart-curves" class="chart-pane"></div>
  <div id="chart-sensitivity" class="chart-pane" style="display:none"></div>
  <div id="chart-optimization" class="chart-pane" style="display:none">
    <div id="opt-bestsofar" style="height:240px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--plot-bg)"></div>
    <div id="opt-scatter-grid" class="opt-scatter-grid"></div>
  </div>
</div>
</div>

<script src="plotly-basic-2.35.2.min.js"></script>
<script src="page-results.js"></script>
</body>
</html>
